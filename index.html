<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Viewer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      color: #222;
    }
    header {
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header a { color: #1769aa; }
    main { flex: 1; min-height: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <header>
    <strong>PDF Viewer</strong>
    <a href="PRINT_COLOR_meimeicat_update1.pdf" target="_blank" rel="noopener">
      Open PDF separately
    </a>
  </header>
  <main>
    <iframe
      src="PRINT_COLOR_meimeicat_update1.pdf"
      title="PDF document"
    ></iframe>
  </main>
</body>
</html>
